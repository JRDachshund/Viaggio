<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cities • Viaggio</title>

    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background:#f8fafc;
        }
        .page-content {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 24px 60px;
        }

        h1{
            text-align:center;
        }

        .country{
            background:white;
            margin-bottom:30px;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .cities{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            margin-top:15px;
        }

        .city-card{
            width:180px;
            padding:15px;
            border:2px solid #ddd;
            border-radius:10px;
            cursor:pointer;
            transition:.2s;
            text-align:center;
            background:white;
        }

        .city-card:hover{
            border-color:#e079e2;
        }

        .city-card.selected{
            background:#7c3aed;
            color:white;
            border-color:#7c3aed;
        }

        button{
            display:block;
            margin:40px auto;
            padding:12px 40px;
            font-size:18px;
            cursor:pointer;
        }

    </style>
</head>

<body>
  {% include 'nav.html' %}

<div class="page-content">

<h1>Select Cities</h1>

{% for country, city_list in cities.items() %}

<div class="country">

    <h2>{{ country }}</h2>

    <div class="cities">

        {% for city in city_list %}

        <div
            class="city-card"
            data-name="{{ city.name }}"
            data-code="{{ city.code }}"
        >

            <h3>{{ city.name }}</h3>

            <p>{{ city.code }}</p>

        </div>

        {% endfor %}

    </div>

</div>

{% endfor %}

<button id="continue">
    Continue
</button>

<script>

let selectedCities = [];

document.querySelectorAll(".city-card").forEach(card => {

    card.addEventListener("click", () => {

        card.classList.toggle("selected");

        const city = {
            name: card.dataset.name,
            code: card.dataset.code
        };

        if(card.classList.contains("selected")){

            selectedCities.push(city);

        }else{

            selectedCities = selectedCities.filter(c => c.code !== city.code);

        }

    });

});

document.getElementById("continue").addEventListener("click", async () => {

    await fetch("/saveCities",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(selectedCities)

    });

    window.location.href="/accommodationSelection";

});

</script>

</div>
</body>
</html>
