<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations • Viaggio</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        margin: 0;
        color: #1e293b;
      }
      .page-content {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 24px 60px;
      }
    </style>
</head>
<body>
  {% include 'nav.html' %}

<div class="page-content">

<h1>Select Countries</h1>

{% for country, neighbors in world_graph.items() %}

<div id="country-{{ country }}">

    <h2>{{ country }}</h2>

    <p>Connections: {{ neighbors|join(", ") }}</p>

    <button onclick="acceptCountry('{{ country }}')">Yes</button>
    <button onclick="rejectCountry('{{ country }}')">No</button>

</div>

{% endfor %}

<hr>

<a href="/citySelection">
    <button>Continue to Cities</button>
</a>

<script>

async function acceptCountry(country) {

    await fetch("/acceptCountry", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({country})
    });

    document.getElementById("country-" + country).remove();
}

async function rejectCountry(country) {

    await fetch("/rejectCountry", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({country})
    });

    document.getElementById("country-" + country).remove();
}

</script>

</div>
</body>
</html>
