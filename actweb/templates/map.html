<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map • Viaggio</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f8fafc; 
      margin: 0;
      color: #1e293b;
    }
    .page-content {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 { margin-top: 0; }
    .map-placeholder {
      height: 420px;
      background: linear-gradient(145deg, #e0f2fe, #f0fdfa);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 1px solid #bae6fd;
      margin-top: 20px;
    }
    .map-placeholder h3 {
      margin: 0 0 8px;
      color: #0369a1;
    }
    .note {
      font-size: 0.95rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  {% include 'nav.html' %}
  
  <div class="page-content">
    <div class="card">
      <h1>Your Trip Map</h1>
      <p>Visual overview of your selected cities and hotels.</p>
      
      <div class="map-placeholder">
        <h3>🗺️ Interactive Map</h3>
        <p class="note">Map integration coming soon.<br>
        Your chosen destinations will appear here.</p>
      </div>
      
      <p style="margin-top: 30px; text-align: center;">
        <a href="/accommodationSelection" style="margin-right: 16px;">← Back to Hotels</a>
        <a href="/tripSummary">Go to Trip Summary →</a>
      </p>
    </div>
  </div>
</body>
</html>
