<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Summary • Viaggio</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        margin: 0;
        color: #1e293b;
      }
      .page-content {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 24px 60px;
      }
    </style>
</head>
<body>
  {% include 'nav.html' %}

<div class="page-content">

<h1>Selected Hotels</h1>

{% if selected_hotels %}

    {% for city, hotels in selected_hotels.items() %}

        <h2>{{ city }}</h2>

        {% for hotel in hotels %}

        <div style="margin-bottom:40px">

            <h3>{{ hotel.name }}</h3>

            <p>{{ hotel.country }}</p>

            <p>{{ hotel.description }}</p>

            <img
                src="{{ hotel.image }}"
                width="300">

        </div>

        {% endfor %}

    {% endfor %}

{% else %}

<h2>No hotels selected.</h2>

{% endif %}

</div>
</body>
</html>
